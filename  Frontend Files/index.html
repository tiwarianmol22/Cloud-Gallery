<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudGallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>CloudGallery 📸</h1>
  
  <div class="upload-section">
    <div class="input-group">
      <input id="album" placeholder="Album name" />
      <input id="image" type="file" accept="image/*" />
      <button onclick="upload()">Upload</button>
      <button onclick="fetchAlbums()">View Albums</button>
    </div>
  </div>

  <div id="output"></div>

  <!-- Modal for full-size image -->
  <div id="image-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; backdrop-filter: blur(5px);">
    <div style="position:relative; max-width:95%; max-height:95%;">
      <img id="modal-img" src="" style="max-width:100%; max-height:95vh; border-radius:12px; display:block; margin:0 auto; box-shadow: 0 20px 40px rgba(0,0,0,0.3);" />
      <button id="modal-close" style="position:absolute; top:16px; right:16px; background:#fff; border:none; padding:8px 12px; cursor:pointer; border-radius:8px; font-weight:600;">Close</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
